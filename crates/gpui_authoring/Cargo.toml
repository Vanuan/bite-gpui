[package]
name = "gpui_authoring"
version = "0.2.2"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "Zed's declarative UI authoring layer"
repository = "https://github.com/zed-industries/zed"
homepage = "https://gpui.rs"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]


[lints]
workspace = true

[features]
default = []
# Test-only APIs: deterministic dispatchers, `TestAppContext`, and the
# renderer readback paths the engine gates behind the same feature.
test-support = [
    "leak-detection",
    "collections/test-support",
    "gpui_types/test-support",
    "gpui_engine/test-support",
    "gpui_engine_default/test-support",
    "gpui_platform/test-support",
    "http_client/test-support",
    "proptest",
]
bench = ["test-support", "profiler", "dep:criterion"]
inspector = ["gpui_macros/inspector"]
leak-detection = ["backtrace"]
wayland = ["gpui_platform/wayland", "gpui_linux?/wayland"]
x11 = [
    "scap?/x11",
    "gpui_platform/x11",
    "gpui_linux?/x11",
]
screen-capture = [
    "scap",
    "gpui_platform/screen-capture",
    "gpui_linux?/screen-capture",
    "gpui_macos?/screen-capture",
    "gpui_windows?/screen-capture",
]
windows-manifest = ["dep:embed-resource"]
profiler = ["dep:hdrhistogram"]

[lib]
path = "src/gpui_authoring.rs"
doctest = false

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
arc-swap.workspace = true
async-task.workspace = true
backtrace = { workspace = true, optional = true }
collections.workspace = true
criterion = { workspace = true, optional = true }
ctor.workspace = true
derive_more.workspace = true
etagere.workspace = true
futures.workspace = true
futures-concurrency.workspace = true
gpui_engine.workspace = true
gpui_engine_default.workspace = true
gpui_macros.workspace = true
gpui_platform.workspace = true
gpui_types = { workspace = true, features = ["lyon"] }
gpui_util.workspace = true
hdrhistogram = { workspace = true, optional = true }
heapless.workspace = true
http_client.workspace = true
image.workspace = true
inventory.workspace = true
itertools.workspace = true
log.workspace = true
lyon = "1.0"
parking_lot.workspace = true
pin-project = "1.1.10"
pollster.workspace = true
postage.workspace = true
proptest = { workspace = true, optional = true }
profiling.workspace = true
rand.workspace = true
raw-window-handle.workspace = true
refineable.workspace = true
regex.workspace = true
resvg.workspace = true
scheduler.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
async-channel.workspace = true
stacksafe.workspace = true
strum.workspace = true
sum_tree.workspace = true
thiserror.workspace = true
tracing.workspace = true
waker-fn = "1.2.0"
spin = "0.10.0"
url.workspace = true
usvg.workspace = true
uuid.workspace = true
util_macros.workspace = true
web-time.workspace = true
ztracing.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook.workspace = true
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(target_os = "macos")'.dependencies]
block.workspace = true
cocoa.workspace = true
cocoa-foundation.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics.workspace = true
core-video.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Power"] }

[dev-dependencies]
backtrace.workspace = true
collections = { workspace = true, features = ["test-support"] }
env_logger.workspace = true
gpui_engine_default = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_util = { workspace = true }
lyon = { version = "1.0", features = ["extra"] }
rand.workspace = true
scheduler = { workspace = true, features = ["test-support"] }
unicode-segmentation.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
http_client = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
reqwest_client = { workspace = true, features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen = { workspace = true }
gpui_web.workspace = true

[build-dependencies]
embed-resource = { version = "3.0", optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.71"
cbindgen.workspace = true

[package.metadata.cargo-machete]
ignored = ["tracing"]

